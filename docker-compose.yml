services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: root-cause-clickstack
    ports:
      - "8080:8080"
      - "8123:8123"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - clickstack_data:/var/lib/clickhouse

  neo4j:
    image: neo4j:5
    container_name: root-cause-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/rootcause
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  clickstack_data:
  neo4j_data:
  neo4j_logs:
