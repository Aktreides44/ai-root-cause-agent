services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: root-cause-clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  clickhouse_data:
